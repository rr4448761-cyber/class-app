<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#6c5ce7">
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Dashboard - Kelas XI.5</title>
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: #f4f5f9; padding-bottom: 90px; }
        
        .header { padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .badge { background: #6c5ce7; color: white; padding: 10px 15px; border-radius: 14px; font-weight: 700; font-size: 18px; box-shadow: 0 8px 20px rgba(108,92,231,0.3); }
        .header-text span { font-size: 12px; color: #8e9bb3; font-weight: 500; }
        .header-text strong { font-size: 18px; color: #2d3436; font-weight: 700; }
        
        .profile-card { background: linear-gradient(135deg, #6c5ce7, #4834d4); margin: 0 20px; border-radius: 28px; padding: 25px; color: white; position: relative; box-shadow: 0 15px 30px rgba(108,92,231,0.2); }
        .profile-info { display: flex; align-items: center; gap: 20px; margin-bottom: 25px; cursor: pointer; }
        .avatar-wrap { position: relative; width: 70px; height: 70px; border-radius: 50%; background: #fff; display: flex; justify-content: center; align-items: center; padding: 3px; overflow: hidden;}
        .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .avatar-wrap svg { width: 40px; height: 40px; fill: #b2bec3; }
        .profile-info h4 { font-size: 13px; opacity: 0.9; margin-bottom: 6px; font-weight: 500; }
        .profile-info h2 { font-size: 24px; font-weight: 700; text-transform: uppercase; }
        
        .stats-container { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 18px; display: flex; justify-content: space-around; text-align: center; }
        .stat-item h3 { font-size: 22px; margin-bottom: 4px; font-weight: 700; }
        .stat-item p { font-size: 12px; opacity: 0.8; font-weight: 500; }
        .divider { width: 1px; background: rgba(255,255,255,0.2); }

        .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 25px 20px 15px; margin-bottom: 20px; }
        .menu-item { background: #fff; padding: 18px 10px; border-radius: 20px; text-align: center; cursor: pointer; color: inherit; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid #f1f2f6; transition: 0.2s; }
        .menu-item:active { transform: scale(0.95); }
        .menu-icon { width: 48px; height: 48px; margin: 0 auto 12px; border-radius: 16px; display: flex; justify-content: center; align-items: center; background: #f4f5f9; }
        .menu-item p { font-size: 12px; font-weight: 600; color: #2d3436; }

        .section-title { display: flex; justify-content: space-between; padding: 0 25px; margin-bottom: 15px; }
        .section-title h3 { font-size: 16px; color: #2d3436; font-weight: 700; }
        .task-item { background: #fff; margin: 0 20px 12px; padding: 20px; border-radius: 20px; border-left: 6px solid #6c5ce7; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }

        .bottom-nav { position: fixed; bottom: 20px; left: 20px; right: 20px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 15px 0; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 100; }
        .nav-item { text-align: center; color: #b2bec3; text-decoration: none; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: #6c5ce7; transform: translateY(-3px); }
        .nav-item svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background: #fff; padding: 25px; border-radius: 24px; width: 90%; max-width: 450px; max-height: 85vh; overflow-y: auto; }
        .modal-content h3 { margin-bottom: 20px; color: #2d3436; font-size: 18px; }
        .modal-content input, .modal-content select { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #dfe6e9; border-radius: 12px; background: #f8f9fa; font-family: inherit; font-size: 14px; outline: none; }
        .modal-content button { width: 100%; padding: 15px; background: #6c5ce7; color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; margin-bottom: 10px; }
        .btn-close { background: #dfe6e9 !important; color: #636e72 !important; }
        
        /* Toast Notif */
        #toast { visibility: hidden; min-width: 250px; background-color: #2d3436; color: #fff; text-align: center; border-radius: 12px; padding: 16px; position: fixed; z-index: 999; left: 50%; top: 30px; transform: translateX(-50%); font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); opacity: 0; transition: opacity 0.3s, top 0.3s; }
        #toast.show { visibility: visible; opacity: 1; top: 50px; }
        
        /* Admin Panel Styles */
        .user-item { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 15px; border-radius: 12px; margin-bottom: 10px; }
        .user-item div { font-size: 14px; }
        .user-item b { color: #2d3436; font-size: 15px; }
        .btn-del { background: #e74c3c !important; padding: 8px 12px !important; width: auto !important; margin: 0 !important; font-size: 12px !important; }
    </style>
</head>
<body>
    <div id="toast">Notifikasi</div>

    <div class="header">
        <div class="header-left">
            <div class="badge">XI</div>
            <div class="header-text"><span>Aplikasi Kelas</span><strong>CLASS-XI.5</strong></div>
        </div>
    </div>
    
    <div class="profile-card">
        <div class="profile-info" onclick="document.getElementById('avatarInput').click()">
            <div class="avatar-wrap">
                <img id="userAvatar" src="" style="display:none;">
                <svg id="defaultAvatar" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div><h4>Selamat Datang,</h4><h2 id="userName">LOADING...</h2></div>
        </div>
        <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="updateAvatar(event)">
        <div class="stats-container">
            <div class="stat-item"><h3>100%</h3><p>Kehadiran</p></div>
            <div class="divider"></div>
            <div class="stat-item"><h3 id="taskCount">0</h3><p>Tugas Aktif</p></div>
            <div class="divider"></div>
            <div class="stat-item"><h3>-</h3><p>Nilai Rata-rata</p></div>
        </div>
    </div>

    <div class="menu-grid">
        <a class="menu-item" onclick="openFeature('jadwal')"><div class="menu-icon"><svg width="24" height="24" viewBox="0 0 24 24" stroke="#e74c3c" fill="none" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></div><p>Jadwal</p></a>
        <a class="menu-item" onclick="openFeature('nilai')"><div class="menu-icon"><svg width="24" height="24" viewBox="0 0 24 24" stroke="#3498db" fill="none" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg></div><p>Nilai</p></a>
        <a class="menu-item" onclick="openFeature('ujian')"><div class="menu-icon"><svg width="24" height="24" viewBox="0 0 24 24" stroke="#e67e22" fill="none" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg></div><p>Ujian</p></a>
        <a class="menu-item" onclick="openFeature('tugas')"><div class="menu-icon"><svg width="24" height="24" viewBox="0 0 24 24" stroke="#d35400" fill="none" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg></div><p>Tugas</p></a>
        <a class="menu-item" onclick="openFeature('perpustakaan')"><div class="menu-icon"><svg width="24" height="24" viewBox="0 0 24 24" stroke="#2ecc71" fill="none" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></div><p>Materi</p></a>
        <a class="menu-item" onclick="openFeature('kehadiran')"><div class="menu-icon"><svg width="24" height="24" viewBox="0 0 24 24" stroke="#9b59b6" fill="none" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><polyline points="17 11 19 13 23 9"></polyline></svg></div><p>Absen</p></a>
        <a class="menu-item" onclick="openFeature('keuangan')"><div class="menu-icon"><svg width="24" height="24" viewBox="0 0 24 24" stroke="#f1c40f" fill="none" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg></div><p>Kas</p></a>
        <a class="menu-item" onclick="openFeature('admin')"><div class="menu-icon"><svg width="24" height="24" viewBox="0 0 24 24" stroke="#34495e" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg></div><p>Lainnya</p></a>
    </div>

    <div class="section-title"><h3>Info & Tugas Terbaru</h3></div>
    <div id="taskListContainer" style="margin-bottom: 100px;"></div>

    <div class="modal" id="featureModal"><div class="modal-content" id="modalContent"></div></div>

    <div class="bottom-nav">
        <a href="/dashboard" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Beranda</a>
        <a href="/chat" class="nav-item"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>Chat</a>
        <a href="/status" class="nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>Status</a>
        <a href="#" class="nav-item" onclick="logout()"><svg viewBox="0 0 24 24" style="stroke:#e74c3c;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>Logout</a>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let currentUser = null;
        const socket = io();

        // FUNGSI NOTIFIKASI TOAST
        function showToast(title, msg) {
            const toast = document.getElementById('toast');
            toast.innerHTML = `<b>${title}</b><br>${msg}`;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 4000);
        }

        socket.on('new_notif', (data) => { showToast(data.title, data.msg); });

        async function init() {
            try { 
                const res = await fetch('/api/me'); 
                if (!res.ok) throw new Error(); 
                currentUser = await res.json(); 
                document.getElementById('userName').innerText = currentUser.name;
                if (currentUser.avatar) {
                    document.getElementById('userAvatar').src = currentUser.avatar; document.getElementById('userAvatar').style.display = 'block'; document.getElementById('defaultAvatar').style.display = 'none';
                }
            } catch (e) { window.location.href = '/'; return; }
            loadTasks();
        }

        async function updateAvatar(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                document.getElementById('userAvatar').src = e.target.result; document.getElementById('userAvatar').style.display = 'block'; document.getElementById('defaultAvatar').style.display = 'none';
                await fetch('/api/profile/avatar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ avatar: e.target.result }) });
            };
            reader.readAsDataURL(file);
        }

        async function loadTasks() {
            const res = await fetch('/api/tasks'); const tasks = await res.json();
            document.getElementById('taskCount').innerText = tasks.length;
            document.getElementById('taskListContainer').innerHTML = tasks.map(t => `<div class="task-item"><h4 style="color:#6c5ce7; font-size:14px; margin-bottom:5px;">${t.subject}</h4><p style="font-size:14px; color:#2d3436; font-weight:600;">${t.title}</p><small style="color:#e74c3c; margin-top:8px; display:block;">Tenggat: ${new Date(t.due_date).toLocaleString()}</small></div>`).join('');
        }

        async function openFeature(feature) {
            const modal = document.getElementById('featureModal');
            const content = document.getElementById('modalContent');
            modal.style.display = 'flex'; content.innerHTML = '<p style="text-align:center">Memuat...</p>';
            let html = `<h3>${feature === 'admin' ? 'Menu Lainnya' : feature.charAt(0).toUpperCase() + feature.slice(1)}</h3>`;

            try {
                if (feature === 'admin') {
                    if (currentUser.role === 'admin') {
                        const uRes = await fetch('/api/admin/users'); const users = await uRes.json();
                        html += `<p style="font-size:13px; color:#e74c3c; margin-bottom:15px;">*Panel Admin: Kelola Akun</p>`;
                        users.forEach(u => {
                            html += `<div class="user-item"><div><b>${u.full_name}</b><br><small>U: ${u.username} | P: ${u.plain_password} (${u.role})</small></div>
                                     ${u.id !== currentUser.id ? `<button class="btn-del" onclick="delUser(${u.id})">Hapus</button>` : ''}</div>`;
                        });
                    } else {
                        html += `<p>Tidak ada pengaturan tambahan.</p>`;
                    }
                }
                else if (feature === 'tugas') {
                    if (currentUser.role === 'admin') html += `<form onsubmit="submitData(event, 'tasks')" style="margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid #eee;"><input type="text" id="p1" placeholder="Mata Pelajaran" required><input type="text" id="p2" placeholder="Judul Tugas" required><input type="datetime-local" id="p3" required><button type="submit">Tambah Tugas</button></form>`;
                    const res = await fetch('/api/tasks'); const data = await res.json();
                    html += data.length === 0 ? '<p>Kosong.</p>' : data.map(d => `<div style="border-bottom:1px solid #eee; padding:10px 0"><b>${d.subject}</b> - ${d.title}</div>`).join('');
                } 
                else if (feature === 'jadwal') {
                    if (currentUser.role === 'admin') html += `<form onsubmit="submitData(event, 'schedules')" style="margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid #eee;"><select id="p1"><option value="Senin">Senin</option><option value="Selasa">Selasa</option><option value="Rabu">Rabu</option><option value="Kamis">Kamis</option><option value="Jumat">Jumat</option></select><input type="time" id="p2" required><input type="time" id="p3" required><input type="text" id="p4" placeholder="Mapel" required><input type="text" id="p5" placeholder="Guru"><button type="submit">Tambah Jadwal</button></form>`;
                    const res = await fetch('/api/schedules'); const data = await res.json();
                    html += data.length === 0 ? '<p>Kosong.</p>' : data.map(d => `<div style="border-bottom:1px solid #eee; padding:10px 0"><b>${d.day} (${d.start_time}-${d.end_time})</b>: ${d.subject}</div>`).join('');
                }
                else if (feature === 'nilai') {
                    if (currentUser.role === 'admin') {
                        const uRes = await fetch('/api/users'); const users = await uRes.json();
                        html += `<form onsubmit="submitData(event, 'grades')" style="margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid #eee;"><select id="p1">${users.map(u=>`<option value="${u.id}">${u.full_name}</option>`).join('')}</select><input type="text" id="p2" placeholder="Mapel" required><input type="number" id="p3" placeholder="Nilai" required><input type="text" id="p4" placeholder="Tipe (UTS/UAS/Tugas)" required><button type="submit">Tambah Nilai</button></form>`;
                    }
                    const res = await fetch('/api/grades'); const data = await res.json();
                    html += data.length === 0 ? '<p>Kosong.</p>' : data.map(d => `<div style="border-bottom:1px solid #eee; padding:10px 0"><b>${d.subject}</b> (${d.type}): ${d.score}</div>`).join('');
                }
                else if (feature === 'ujian') {
                    if (currentUser.role === 'admin') html += `<form onsubmit="submitData(event, 'exams')" style="margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid #eee;"><input type="text" id="p1" placeholder="Mapel" required><input type="text" id="p2" placeholder="Judul Ujian" required><input type="datetime-local" id="p3" required><button type="submit">Tambah Ujian</button></form>`;
                    const res = await fetch('/api/exams'); const data = await res.json();
                    html += data.length === 0 ? '<p>Kosong.</p>' : data.map(d => `<div style="border-bottom:1px solid #eee; padding:10px 0"><b>${d.subject}</b>: ${d.title}</div>`).join('');
                }
                else if (feature === 'perpustakaan') {
                    if (currentUser.role === 'admin') html += `<form onsubmit="submitData(event, 'library')" style="margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid #eee;"><input type="text" id="p1" placeholder="Judul Materi" required><input type="text" id="p2" placeholder="Mapel" required><input type="url" id="p3" placeholder="Link Google Drive" required><button type="submit">Tambah Materi</button></form>`;
                    const res = await fetch('/api/library'); const data = await res.json();
                    html += data.length === 0 ? '<p>Kosong.</p>' : data.map(d => `<div style="border-bottom:1px solid #eee; padding:10px 0"><b>${d.title}</b> (${d.subject})<br><a href="${d.link}" target="_blank">Buka Link</a></div>`).join('');
                }
                else if (feature === 'kehadiran') {
                    if (currentUser.role === 'admin') {
                        const uRes = await fetch('/api/users'); const users = await uRes.json();
                        html += `<form onsubmit="submitData(event, 'attendance')" style="margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid #eee;"><select id="p1">${users.map(u=>`<option value="${u.id}">${u.full_name}</option>`).join('')}</select><select id="p2"><option value="Hadir">Hadir</option><option value="Izin">Izin</option><option value="Sakit">Sakit</option><option value="Alpa">Alpa</option></select><button type="submit">Update Absen</button></form>`;
                    }
                    const res = await fetch('/api/attendance'); const data = await res.json();
                    html += data.length === 0 ? '<p>Kosong.</p>' : data.map(d => `<div style="border-bottom:1px solid #eee; padding:10px 0"><b>${new Date(d.date).toLocaleDateString()}</b>: ${d.status}</div>`).join('');
                }
                else if (feature === 'keuangan') {
                    if (currentUser.role === 'admin') {
                        const uRes = await fetch('/api/users'); const users = await uRes.json();
                        html += `<form onsubmit="submitData(event, 'finance')" style="margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid #eee;"><select id="p1">${users.map(u=>`<option value="${u.id}">${u.full_name}</option>`).join('')}</select><input type="number" id="p2" placeholder="Jumlah (Rp)" required><input type="text" id="p3" placeholder="Status (Lunas/Belum)" required><input type="text" id="p4" placeholder="Keterangan" required><button type="submit">Tambah Kas</button></form>`;
                    }
                    const res = await fetch('/api/finance'); const data = await res.json();
                    html += data.length === 0 ? '<p>Kosong.</p>' : data.map(d => `<div style="border-bottom:1px solid #eee; padding:10px 0"><b>${d.description}</b>: Rp${d.amount} (${d.status})</div>`).join('');
                }
            } catch (e) { html += `<p style="color:red">Gagal memuat data.</p>`; }
            html += `<button class="btn-close" onclick="document.getElementById('featureModal').style.display='none'">Tutup</button>`;
            content.innerHTML = html;
        }

        // FUNGSI KIRIM DATA KE 8 FITUR
        async function submitData(e, endpoint) {
            e.preventDefault();
            let payload = {};
            if(endpoint === 'tasks') payload = { subject: document.getElementById('p1').value, title: document.getElementById('p2').value, due_date: document.getElementById('p3').value };
            else if(endpoint === 'schedules') payload = { day: document.getElementById('p1').value, start_time: document.getElementById('p2').value, end_time: document.getElementById('p3').value, subject: document.getElementById('p4').value, teacher: document.getElementById('p5').value };
            else if(endpoint === 'grades') payload = { user_id: document.getElementById('p1').value, subject: document.getElementById('p2').value, score: document.getElementById('p3').value, type: document.getElementById('p4').value };
            else if(endpoint === 'exams') payload = { subject: document.getElementById('p1').value, title: document.getElementById('p2').value, exam_date: document.getElementById('p3').value };
            else if(endpoint === 'library') payload = { title: document.getElementById('p1').value, subject: document.getElementById('p2').value, link: document.getElementById('p3').value };
            else if(endpoint === 'attendance') payload = { user_id: document.getElementById('p1').value, status: document.getElementById('p2').value };
            else if(endpoint === 'finance') payload = { user_id: document.getElementById('p1').value, amount: document.getElementById('p2').value, status: document.getElementById('p3').value, description: document.getElementById('p4').value };
            
            const res = await fetch(`/api/${endpoint}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if(res.ok) { alert('Data berhasil ditambahkan!'); openFeature(endpoint); loadTasks(); } else alert('Gagal!');
        }

        async function delUser(id) {
            if(!confirm('Yakin hapus akun siswa ini?')) return;
            const res = await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
            if(res.ok) { alert('Akun dihapus!'); openFeature('admin'); } else alert('Gagal hapus.');
        }

        async function logout() { await fetch('/api/logout', { method: 'POST' }); window.location.href = '/'; }
        init();
    </script>
</body>
</html>
