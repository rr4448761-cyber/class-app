<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#6c5ce7">
    <link rel="manifest" href="/manifest.json">
    <title>Dashboard - Kelas XI.5</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: #f7f8fc; padding-bottom: 80px; }
        .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .badge { background: #6c5ce7; color: white; padding: 10px 15px; border-radius: 12px; font-weight: bold; font-size: 18px; box-shadow: 0 4px 10px rgba(108,92,231,0.3); }
        .header-text span { font-size: 12px; color: #636e72; display: block; }
        .header-text strong { font-size: 18px; color: #2d3436; }
        .bell { background: white; padding: 12px; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; }
        .bell svg { stroke: #f1c40f; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .bell-dot { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; background: #e74c3c; border-radius: 50%; display: none; }
        .profile-card { background: linear-gradient(135deg, #6c5ce7, #4834d4); margin: 0 20px; border-radius: 24px; padding: 25px; color: white; position: relative; overflow: hidden; box-shadow: 0 10px 20px rgba(108,92,231,0.3); }
        .profile-card::before { content: ''; position: absolute; top: -50px; right: -50px; width: 180px; height: 180px; background: rgba(255,255,255,0.1); border-radius: 50%; }
        .profile-info { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; position: relative; z-index: 1; }
        .profile-info img { width: 65px; height: 65px; border-radius: 50%; border: 3px solid white; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .profile-info h4 { font-size: 13px; font-weight: normal; opacity: 0.9; margin-bottom: 4px; }
        .profile-info h2 { font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .stats-container { background: linear-gradient(135deg, #ff7f50, #ff6348); border-radius: 18px; padding: 18px; display: flex; justify-content: space-around; position: relative; z-index: 1; text-align: center; box-shadow: 0 4px 15px rgba(255,127,80,0.4); }
        .stat-item h3 { font-size: 22px; margin-bottom: 5px; font-weight: bold; }
        .stat-item p { font-size: 12px; opacity: 0.9; }
        .divider { width: 1px; background: rgba(255,255,255,0.3); }
        .search-bar { margin: 25px 20px; background: #3c37a6; padding: 15px 20px; border-radius: 15px; display: flex; align-items: center; gap: 12px; color: white; box-shadow: 0 5px 15px rgba(60,55,166,0.3); }
        .search-bar svg { stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        .search-bar input { background: transparent; border: none; color: white; outline: none; font-size: 14px; width: 100%; }
        .search-bar input::placeholder { color: rgba(255,255,260,0.6); }
        .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 0 20px; margin-bottom: 25px; }
        .menu-item { background: white; padding: 15px 5px; border-radius: 16px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.03); cursor: pointer; text-decoration: none; color: inherit; transition: 0.2s; }
        .menu-item:active { transform: scale(0.95); }
        .menu-icon { background: #f0f0ff; width: 45px; height: 45px; margin: 0 auto 10px; border-radius: 12px; display: flex; justify-content: center; align-items: center; }
        .menu-item p { font-size: 11px; font-weight: 600; color: #636e72; }
        .section-title { display: flex; justify-content: space-between; padding: 0 20px; margin-bottom: 15px; align-items: center; }
        .section-title h3 { font-size: 16px; color: #2d3436; font-weight: 700; }
        .section-title a { font-size: 13px; color: #6c5ce7; text-decoration: none; font-weight: bold; }
        .schedule-card { background: white; margin: 0 20px 25px; border-radius: 16px; padding: 30px 20px; text-align: center; color: #b2bec3; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 2px dashed #dfe6e9; }
        .task-item { background: white; margin: 0 20px 12px; padding: 18px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border-left: 5px solid #6c5ce7; }
        .task-item h4 { font-size: 14px; margin-bottom: 6px; color: #6c5ce7; }
        .task-item p { font-size: 14px; color: #2d3436; font-weight: 600; margin-bottom: 8px; }
        .task-item small { color: #e74c3c; font-size: 12px; background: #fdeaea; padding: 4px 8px; border-radius: 6px; display: inline-block; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 15px 0 20px; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); border-top-left-radius: 25px; border-top-right-radius: 25px; z-index: 100; }
        .nav-item { text-align: center; color: #b2bec3; text-decoration: none; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
        .nav-item svg { width: 24px; height: 24px; stroke: #b2bec3; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .nav-item.active { color: #6c5ce7; }
        .nav-item.active svg { stroke: #6c5ce7; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 200; backdrop-filter: blur(3px); }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; }
        .modal-content h3 { margin-bottom: 20px; color: #2d3436; display: flex; align-items: center; gap: 10px; }
        .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #dfe6e9; border-radius: 10px; font-family: inherit; font-size: 14px; background: #f9f9f9; }
        .modal-content button { width: 100%; padding: 14px; background: #6c5ce7; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 5px; }
        .btn-cancel { background: #dfe6e9 !important; color: #636e72 !important; }
        .schedule-item { background: white; margin: 0 20px 10px; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); display: flex; align-items: center; gap: 15px; border-left: 4px solid #6c5ce7; }
        .schedule-time { background: #f0f0ff; color: #6c5ce7; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; text-align: center; min-width: 80px; }
        .schedule-info h4 { font-size: 14px; color: #2d3436; margin-bottom: 4px; }
        .schedule-info p { font-size: 12px; color: #636e72; }
        #fabContainer { position:fixed; bottom:90px; right:20px; display:none; flex-direction:column; gap:10px; z-index:50; }
        .fab-btn { border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .fab-green { width: 50px; height: 50px; background: #00b894; }
        .fab-purple { width: 60px; height: 60px; background: #6c5ce7; }
        .fab-btn svg { stroke: white; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .modal-close-btn { background:#b2bec3; margin-top: 15px; }
    </style>
</head>
<body>

        <a href="#" class="menu-item">

        </a>

            <div class="menu-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d35400" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><line x1="9" y1="12" x2="15" y2="12"></line><line x1="9" y1="16" x2="15" y2="16"></line></svg></div>
            <p>Tugas</p>
        </a>
        <a href="#" class="menu-item">

        <a href="#" class="menu-item">

            Logout
        </a>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
        let currentUser = null;
        const socket = io();
        const daysOfWeek = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'sabtu'];
        let allSchedules = [];

        async function init() {
            try { const res = await fetch('/api/me'); if (!res.ok) throw new Error(); currentUser = await res.json(); } catch (e) { window.location.href = '/'; return; }
            document.getElementById('userName').innerText = currentUser.name;
            document.getElementById('userAvatar').src = currentUser.avatar;
            if (currentUser.role === 'admin') document.getElementById('fabContainer').style.display = 'flex';
            
            loadTasks();
            loadSchedules();
            
            socket.on('new_task_broadcast', (data) => {
                loadTasks();
                if(currentUser.role !== 'admin') {
                    document.getElementById('notifDot').style.display = 'block';
                    const toast = document.createElement('div');
                    toast.style.cssText = 'position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#2d3436; color:white; padding:15px 25px; border-radius:10px; z-index:999; font-size:14px; box-shadow:0 10px 25px rgba(0,0,0,0.2); width:90%; max-width:400px; text-align:center;';
                    toast.innerHTML = `<b>TUGAS BARU</b><br>${data.notifMessage}`;
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 5000);
                }
            });
            
            socket.on('schedule_updated', () => { loadSchedules(); });
        }

        async function loadTasks() {
            const res = await fetch('/api/tasks');
            const tasks = await res.json();
            document.getElementById('taskCount').innerText = tasks.length;
            const container = document.getElementById('taskListContainer');
            if (tasks.length === 0) { container.innerHTML = `<div style="text-align:center; padding:20px; color:#b2bec3; font-size:14px;">Belum ada tugas.</div>`; return; }
            container.innerHTML = tasks.map(t => `<div class="task-item"><h4>${t.subject}</h4><p>${t.title}</p><small>Deadline: ${new Date(t.due_date).toLocaleString()}</small></div>`).join('');
        }

        async function loadSchedules() {
            const res = await fetch('/api/schedules');
            allSchedules = await res.json();
            renderTodaySchedule();
        }

        function renderTodaySchedule() {
            const today = daysOfWeek[new Date().getDay()];
            const container = document.getElementById('todayScheduleContainer');
            if (today === 'Sabtu' || today === 'Minggu') {
                container.innerHTML = `<div class="schedule-card" style="margin:0 20px;">Hari ${today}. Libur, tidak ada jadwal.</div>`;
                return;
            }
            const todaySchedules = allSchedules.filter(s => s.day === today);
            if (todaySchedules.length === 0) {
                container.innerHTML = `<div class="schedule-card" style="margin:0 20px;">Belum ada jadwal untuk hari ${today}.</div>`;
                return;
            }
            container.innerHTML = todaySchedules.map(s => `<div class="schedule-item"><div class="schedule-time">${s.start_time}<br><span style="font-weight:normal; font-size:10px;">${s.end_time}</span></div><div class="schedule-info"><h4>${s.subject}</h4><p>${s.teacher} &middot; ${s.room}</p></div></div>`).join('');
        }

        function showAllSchedules() {
            const days = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat'];
            let html = '';
