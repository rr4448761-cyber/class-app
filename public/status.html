<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Status - WhatsApp by Kyz</title>
    <style>
        :root { --gold: #C5A059; --bg: #0b141a; --card: #202c33; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: #fff; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
        
        .header { padding: 15px 20px; display: flex; align-items: center; gap: 15px; background: var(--card); z-index: 10; }
        .header a { color: var(--gold); text-decoration: none; font-size: 20px; font-weight: bold; }
        .header h2 { font-size: 18px; font-weight: 600; color: #e9edef; }

        .main-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding: 20px; text-align: center; }
        
        .create-btn { background: var(--gold); color: #111; padding: 15px 30px; border-radius: 30px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; display: flex; align-items: center; gap: 10px; margin-top: 20px; box-shadow: 0 4px 15px rgba(197,160,89,0.3); }
        
        /* Story Viewer Full Screen */
        .story-viewer { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: #000; z-index: 100; flex-direction: column; }
        .story-viewer.active { display: flex; }
        
        .progress-bar-container { position: absolute; top: 10px; left: 10px; right: 10px; height: 3px; background: rgba(255,255,255,0.3); z-index: 102; border-radius: 2px; }
        .progress-bar { height: 100%; background: #fff; width: 0%; transition: width 5s linear; border-radius: 2px; }
        
        .story-header { position: absolute; top: 20px; left: 15px; display: flex; align-items: center; gap: 10px; z-index: 102; font-weight: 600; padding: 10px; background: rgba(0,0,0,0.5); border-radius: 20px; }
        .story-header img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
        
        .story-media { width: 100%; height: 100%; object-fit: contain; background: #000; }
        .story-text { position: absolute; bottom: 15%; left: 10%; right: 10%; text-align: center; font-size: 18px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); padding: 20px; background: rgba(0,0,0,0.4); border-radius: 15px; }
        
        /* Modal Buat Status */
        .input-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; }
        .input-modal.active { display: flex; }
        .input-box { background: var(--card); padding: 25px; border-radius: 16px; width: 90%; max-width: 400px; text-align: center; }
        .input-box textarea { width: 100%; height: 100px; padding: 15px; border-radius: 10px; border: none; background: rgba(255,255,255,0.05); color: #fff; margin-bottom: 15px; font-size: 15px; resize: none; font-family: inherit; outline: none; }
        .input-box input[type="file"] { display: none; }
        .input-box label { display: block; background: rgba(255,255,255,0.1); color: var(--gold); padding: 15px; border-radius: 10px; cursor: pointer; margin-bottom: 15px; font-weight: bold; font-size: 14px; border: 1px dashed var(--gold); }
        .input-box button { width: 100%; padding: 15px; background: var(--gold); color: #111; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/dashboard">&#8592;</a>
        <h2>Status Kelas</h2>
    </div>

    <div class="main-content" id="mainContent">
        <p style="color:#8696a0; margin-bottom: 10px;">Bagikan foto atau video (maks 1 menit) yang hilang setelah 24 jam.</p>
        <button class="create-btn" onclick="document.getElementById('inputModal').classList.add('active')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            Buat Status Baru
        </button>
    </div>

    <!-- Modal Buat Status -->
    <div class="input-modal" id="inputModal">
        <div class="input-box">
            <h3 style="margin-bottom:20px; color:var(--gold);">Buat Status</h3>
            <form onsubmit="submitStatus(event)">
                <textarea id="statusText" placeholder="Ketik teks (opsional)..."></textarea>
                <input type="file" id="statusMedia" accept="image/*,video/*" onchange="document.getElementById('fileName').innerText = this.files[0].name">
                <label for="statusMedia" id="fileName">Pilih Foto / Video (Maks 1 Menit)</label>
                <button type="submit">Unggah Status</button>
                <button type="button" style="background:transparent; color:#aaa; border: 1px solid #aaa; margin-top:5px;" onclick="document.getElementById('inputModal').classList.remove('active')">Batal</button>
            </form>
        </div>
    </div>

    <!-- Layar Lihat Status -->
    <div class="story-viewer" id="storyViewer">
        <div class="progress-bar-container"><div class="progress-bar" id="pBar"></div></div>
        <div class="story-header" id="storyUser"></div>
        <img id="viewerImage" class="story-media" style="display:none;">
        <video id="viewerVideo" class="story-media" style="display:none;" autoplay controls></video>
        <div id="viewerText" class="story-text" style="display:none;"></div>
        <div style="position: absolute; top:0; left:0; right:0; bottom:0; z-index:101;" onclick="closeStory()"></div>
    </div>

    <script>
        let storyTimeout;

        async function init() {
            const res = await fetch('/api/me'); if (!res.ok) window.location.href = '/';
            const urlParams = new URLSearchParams(window.location.search); 
            const targetUserId = urlParams.get('id');
            
            // JIKA ADA ID DI URL, LANGSUNG TAMPILKAN STATUS (SEMBUNYIKAN MENU BUAT STATUS)
            if (targetUserId) {
                document.getElementById('mainContent').style.display = 'none';
                document.querySelector('.header').style.display = 'none';
                viewUserStatus(targetUserId);
            }
        }

        async function submitStatus(e) {
            e.preventDefault();
            const text = document.getElementById('statusText').value;
            const file = document.getElementById('statusMedia').files[0];
            if (!text && !file) return alert('Isi teks atau pilih file!');
            
            if (file) {
                const type = file.type.startsWith('image') ? 'image' : 'video';
                if(type === 'video' && file.size > 20 * 1024 * 1024) return alert('Video terlalu besar! Maks 20MB.');
                
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async () => { await sendStatus(reader.result, type, text); };
            } else { await sendStatus(null, null, text); }
        }

        async function sendStatus(media, media_type, text) {
            const res = await fetch('/api/stories', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ media, media_type, text }) });
            if (res.ok) { 
                // TANPA ALERT, LANGSUNG REDIRECT (PROFESIONAL)
                window.location.href = '/dashboard'; 
            } else alert('Gagal upload.');
        }

        async function viewUserStatus(userId) {
            const res = await fetch('/api/stories'); const stories = await res.json();
            const userStories = stories.filter(s => s.user_id == userId);
            if (userStories.length === 0) return window.location.href = '/status'; // Balik ke awal kalau kosong
            
            const story = userStories[0]; 

            document.getElementById('storyViewer').classList.add('active');
            document.getElementById('storyUser').innerHTML = `<img src="${story.avatar_url || 'https://ui-avatars.com/api/?name='+story.full_name}&background=C5A059&color=fff"><span>${story.full_name}</span>`;
            
            const img = document.getElementById('viewerImage'); const vid = document.getElementById('viewerVideo'); const txt = document.getElementById('viewerText');
            img.style.display = 'none'; vid.style.display = 'none'; txt.style.display = 'none';

            if (story.media) {
                if (story.media_type === 'video') { vid.src = story.media; vid.style.display = 'block'; vid.play(); }
                else { img.src = story.media; img.style.display = 'block'; }
            }
            
            if (story.text) { txt.innerText = story.text; txt.style.display = 'block'; }

            // Progress bar animasi
            const pBar = document.getElementById('pBar');
            pBar.style.width = '0%';
            setTimeout(() => { pBar.style.width = '100%'; }, 100);

            // Auto close
            let duration = story.media_type === 'video' ? (vid.duration * 1000) || 15000 : 15000;
            storyTimeout = setTimeout(() => { closeStory(); }, duration);
        }

        function closeStory() {
            document.getElementById('storyViewer').classList.remove('active');
            document.getElementById('viewerImage').style.display = 'none';
            document.getElementById('viewerVideo').pause(); document.getElementById('viewerVideo').style.display = 'none';
            document.getElementById('viewerText').style.display = 'none';
            clearTimeout(storyTimeout);
            // Balik ke dashboard setelah lihat status
            window.location.href = '/dashboard';
        }

        init();
    </script>
</body>
</html>
