<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - WhatsApp Clone</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #efeae2; --chat-bg: #efeae2; --recv: #fff; --sent: #d9fdd3; --header: #075e54; }
        body.dark { --bg: #0b141a; --chat-bg: #0b141a; --recv: #202c33; --sent: #005c4b; --header: #202c33; }
        
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; transition: background 0.3s; }
        body { display: flex; height: 100vh; overflow: hidden; background: var(--bg); }
        
        .sidebar { width: 35%; min-width: 300px; background: var(--recv); display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px 20px; background: var(--header); color: white; display: flex; align-items: center; gap: 15px; font-weight: 600; }
        .contact-list { flex: 1; overflow-y: auto; }
        .contact { padding: 15px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .contact:hover, .contact.active { background: rgba(0,0,0,0.05); }
        .avatar-circle { width: 50px; height: 50px; border-radius: 50%; background: #ccc; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
        
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); position: relative; }
        .chat-header { padding: 10px 20px; background: var(--header); color: white; display: flex; align-items: center; gap: 15px; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-size: cover; }
        .message { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); color: #000; }
        .message.received { background: var(--recv); align-self: flex-start; border-top-left-radius: 0; }
        .message.sent { background: var(--sent); align-self: flex-end; border-top-right-radius: 0; }
        .message img, .message video { max-width: 100%; border-radius: 6px; margin-top: 5px; display: block; }
        .message audio { max-width: 100%; margin-top: 5px; }
        .message .time { font-size: 10px; color: #888; float: right; margin: 5px 0 0 10px; }
        
        .chat-input { padding: 10px; background: var(--header); display: flex; gap: 8px; align-items: center; }
        .chat-input input[type="text"] { flex: 1; padding: 12px; border-radius: 20px; border: none; outline: none; }
        .btn-icon { background: transparent; border: none; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; padding: 5px; }
        .btn-send { background: #00a884; border-radius: 50%; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; border: none; color: white; cursor: pointer; }
        
        .video-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; flex-direction: column; }
        .video-container.active { display: flex; }
        .remote-video { flex: 1; width: 100%; object-fit: cover; }
        .local-video { position: absolute; top: 20px; right: 20px; width: 100px; height: 150px; object-fit: cover; border-radius: 10px; border: 2px solid white; }
        
        @media (max-width: 768px) { .sidebar { width: 100%; position: absolute; z-index: 20; } .sidebar.hide { display: none; } .chat-area { width: 100%; position: absolute; z-index: 30; display: none; } .chat-area.show { display: flex; } .back-btn { display: flex !important; } }
        .back-btn { display: none; background: transparent; border: none; color: white; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">Chat Kelas</div>
        <div class="contact-list" id="contactList">
            <div class="contact active" onclick="openChat('group', 'Grup Kelas')">
                <div class="avatar-circle"><svg viewBox="0 0 24 24" fill="#888"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
                <div><h4 style="font-size:15px; color:#333;">Grup Kelas</h4><p style="font-size:12px; color:#888;">Semua siswa & admin</p></div>
            </div>
        </div>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="chat-header">
            <button class="back-btn" onclick="closeChatMobile()">&#8592;</button>
            <div id="chatHeaderName" style="font-weight:bold; flex:1;">Grup Kelas</div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
            <input type="file" id="mediaInput" accept="image/*,video/*" style="display:none" onchange="sendMedia(event)">
            <button class="btn-icon" onclick="document.getElementById('mediaInput').click()">📎</button>
            <button class="btn-icon" id="micBtn" onclick="toggleRecording()">🎤</button>
            <input type="text" id="msgInput" placeholder="Ketik pesan..." onkeypress="handleEnter(event)">
            <button class="btn-send" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <div class="video-container" id="videoContainer">
        <video class="remote-video" id="remoteVideo" autoplay playsinline></video>
        <video class="local-video" id="localVideo" autoplay muted playsinline></video>
        <div style="padding:20px; background:#222; text-align:center;"><button onclick="endCall()" style="background:#ff4757; color:white; border:none; padding:10px 20px; border-radius:5px;">Tutup Panggilan</button></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let currentUser = null; let activeChatId = 'group'; let activeChatName = 'Grup Kelas';
        const socket = io();
        let peer = null; let localStream = null; let currentCall = null;

        // Optimistic UI (Langsung tampil tanpa nunggu server)
        function appendMessage(msg, isMine, tempId = null) {
            const div = document.createElement('div');
            div.className = `message ${isMine ? 'sent' : 'received'}`;
            if(tempId) div.id = tempId;
            
            let mediaHtml = '';
            if (msg.media) {
                if (msg.media_type === 'image') mediaHtml = `<img src="${msg.media}">`;
                else if (msg.media_type === 'video') mediaHtml = `<video src="${msg.media}" controls></video>`;
                else if (msg.media_type === 'audio') mediaHtml = `<audio src="${msg.media}" controls></audio>`;
            }
            
            const timeStr = new Date(msg.created_at || new Date()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            div.innerHTML = `${mediaHtml}<p>${msg.message || ''}</p><span class="time">${timeStr} ${isMine ? '✓' : ''}</span>`;
            
            const container = document.getElementById('chatMessages');
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function init() {
            try { const res = await fetch('/api/me'); if(!res.ok) throw new Error(); currentUser = await res.json(); } catch(e) { window.location.href = '/'; return; }
            
            peer = new Peer(`class-xi5-user-${currentUser.id}`, { config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] } });
            peer.on('call', (call) => { 
                if(confirm('Ada panggilan masuk. Terima?')) {
                    navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                        localStream = stream; document.getElementById('localVideo').srcObject = stream; document.getElementById('videoContainer').classList.add('active');
                        call.answer(stream); currentCall = call;
                        call.on('stream', remote => { document.getElementById('remoteVideo').srcObject = remote; });
                    });
                } else call.close();
            });

            const usersRes = await fetch('/api/users'); const users = await usersRes.json();
            const contactList = document.getElementById('contactList');
            users.forEach(u => {
                const div = document.createElement('div'); div.className = 'contact';
                div.onclick = () => openChat(u.id, u.full_name);
                div.innerHTML = `<div class="avatar-circle">${u.avatar_url ? `<img src="${u.avatar_url}">` : `<svg viewBox="0 0 24 24" fill="#888"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4z"/></svg>`}</div>
                                 <div><h4 style="font-size:15px; color:#333;">${u.full_name}</h4><p style="font-size:12px; color:#888;">Chat pribadi</p></div>`;
                contactList.appendChild(div);
            });

            socket.emit('join_chat', { room: 'group' }); socket.emit('join_chat', { room: 'dm', userId: currentUser.id });
            
            // Tangkap Pesan Masuk
            socket.on('receive_message', (msg) => {
                // Hapus pesan sementara (temp) jika ini pesan kita sendiri yang sukses terkirim
                if (msg.sender_id == currentUser.id) {
                    const temp = document.getElementById(`temp-${msg.id}`);
                    if(temp) temp.remove(); 
                }
                if (activeChatId === 'group' && msg.receiver_id === null) appendMessage(msg, false);
                else if (activeChatId !== 'group' && (msg.sender_id == activeChatId || msg.receiver_id == activeChatId)) appendMessage(msg, msg.sender_id == currentUser.id);
            });

            openChat('group', 'Grup Kelas');
        }

        async function openChat(id, name) {
            activeChatId = id; document.getElementById('chatHeaderName').innerText = name;
            document.getElementById('sidebar').classList.add('hide'); document.getElementById('chatArea').classList.add('show');
            const res = await fetch(`/api/messages/${id}`); const messages = await res.json();
            const msgContainer = document.getElementById('chatMessages'); msgContainer.innerHTML = '';
            messages.forEach(m => appendMessage(m, m.sender_id == currentUser.id));
        }

        function sendMessage() {
            const input = document.getElementById('msgInput'); const text = input.value.trim();
            if (!text) return;
            const tempId = `temp-${Date.now()}`;
            // 1. TAMPILKAN LANGSUNG (Optimistic)
            appendMessage({ message: text, sender_id: currentUser.id }, true, tempId);
            input.value = '';
            // 2. KIRIM KE SERVER
            socket.emit('send_message', { sender_id: currentUser.id, sender_name: currentUser.name, receiver_id: activeChatId, message: text, media: null, media_type: null });
        }

        function sendMedia(event) {
            const file = event.target.files[0]; if (!file) return;
            const type = file.type.startsWith('image') ? 'image' : 'video';
            const reader = new FileReader();
            reader.onload = function(e) {
                appendMessage({ media: e.target.result, media_type: type }, true);
                socket.emit('send_message', { sender_id: currentUser.id, sender_name: currentUser.name, receiver_id: activeChatId, message: '', media: e.target.result, media_type: type });
                event.target.value = '';
            };
            reader.readAsDataURL(file);
        }

        // VN Logic
        let mediaRecorder; let audioChunks = []; let isRecording = false;
        async function toggleRecording() {
            const micBtn = document.getElementById('micBtn');
            if (!isRecording) {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream); audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const reader = new FileReader();
                    reader.readAsDataURL(new Blob(audioChunks, { type: 'audio/webm' }));
                    reader.onloadend = () => {
                        appendMessage({ media: reader.result, media_type: 'audio' }, true);
                        socket.emit('send_message', { sender_id: currentUser.id, sender_name: currentUser.name, receiver_id: activeChatId, message: '', media: reader.result, media_type: 'audio' });
                    };
                };
                mediaRecorder.start(); isRecording = true; micBtn.style.color = 'red';
            } else { mediaRecorder.stop(); isRecording = false; micBtn.style.color = 'white'; mediaRecorder.stream.getTracks().forEach(t => t.stop()); }
        }

        function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }
        function closeChatMobile() { document.getElementById('sidebar').classList.remove('hide'); document.getElementById('chatArea').classList.remove('show'); }
        function endCall() { if(currentCall) currentCall.close(); if(localStream) localStream.getTracks().forEach(t=>t.stop()); document.getElementById('videoContainer').classList.remove('active'); }

        init();
    </script>
</body>
</html>
