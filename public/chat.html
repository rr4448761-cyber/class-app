<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chat - WhatsApp by Kyz</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --gold: #C5A059; --bg: #efeae2; --header: #C5A059; --recv: #fff; --sent: #fdf5e6; --text: #000; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { display: flex; height: 100dvh; width: 100vw; overflow: hidden; background: var(--bg); }
        
        .sidebar { width: 35%; min-width: 320px; background: #fff; display: flex; flex-direction: column; border-right: 1px solid #ddd; }
        .sidebar-header { padding: 15px 20px; background: var(--header); color: white; font-weight: 600; font-size: 18px; }
        .contact-list { flex: 1; overflow-y: auto; }
        .contact { padding: 12px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
        .contact:hover, .contact.active { background: #f9f9f9; }
        .avatar-circle { width: 48px; height: 48px; border-radius: 50%; background: #ccc; display: flex; justify-content: center; align-items: center; overflow: hidden; flex-shrink: 0;}
        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-circle svg { width: 30px; height: 30px; fill: #888; }
        
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; }
        .chat-header { padding: 10px 20px; background: var(--header); color: white; display: flex; align-items: center; gap: 15px; z-index: 10; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-size: cover; background-blend-mode: overlay; }
        
        .message { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14.5px; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); color: var(--text); word-wrap: break-word; display: flex; flex-direction: column; }
        .message.received { background: var(--recv); align-self: flex-start; border-top-left-radius: 0; }
        .message.sent { background: var(--sent); align-self: flex-end; border-top-right-radius: 0; }
        
        /* Fitur Reply */
        .reply-box { background: rgba(0,0,0,0.05); border-left: 3px solid var(--gold); padding: 5px 10px; margin-bottom: 5px; border-radius: 4px; font-size: 12px; color: #555; }
        .reply-box b { color: var(--gold); display: block; margin-bottom: 2px;}
        
        .message img, .message video { max-width: 100%; border-radius: 6px; margin-top: 5px; display: block; }
        .message audio { max-width: 100%; margin-top: 5px; outline: none; }
        
        /* Centang Biru/Emas */
        .message .time { font-size: 11px; color: #888; float: right; margin: 5px 0 0 10px; display: flex; align-items: center; gap: 3px; }
        .tick { width: 16px; height: 16px; fill: #888; }
        .tick.read { fill: var(--gold); } /* Centang Emas jika dibaca */

        .chat-input { padding: 10px; background: var(--header); display: flex; gap: 8px; align-items: center; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        .chat-input input[type="text"] { flex: 1; padding: 12px 15px; border-radius: 20px; border: none; outline: none; font-size: 15px; }
        .btn-icon { background: transparent; border: none; cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center;}
        .btn-icon svg { width: 24px; height: 24px; fill: white; }
        .btn-send { background: var(--gold); border-radius: 50%; width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; border: none; cursor: pointer; flex-shrink: 0; }
        .btn-send svg { width: 22px; height: 22px; fill: white; margin-left: -2px; }

        /* Reply Overlay di Input */
        .reply-overlay { display: none; background: #fff; padding: 10px 15px; border-left: 4px solid var(--gold); margin: 0 10px 5px; border-radius: 5px; font-size: 13px; position: relative;}
        .reply-overlay b { color: var(--gold); display: block; margin-bottom: 3px; font-size: 12px;}
        .reply-overlay button { position: absolute; right: 10px; top: 10px; background: none; border: none; font-size: 18px; cursor: pointer; color: #888;}

        /* Konteks Menu (Long Press) */
        .context-menu { display: none; position: fixed; background: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.2); border-radius: 8px; z-index: 300; overflow: hidden; min-width: 120px; }
        .context-menu button { width: 100%; padding: 12px 20px; text-align: left; background: none; border: none; font-size: 14px; cursor: pointer; border-bottom: 1px solid #eee;}
        .context-menu button:hover { background: #f5f5f5; }
        .context-menu button.del { color: #ff4757; }

        /* Video Call UI */
        .video-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; flex-direction: column; }
        .video-container.active { display: flex; }
        .remote-video { flex: 1; width: 100%; object-fit: cover; }
        .local-video { position: absolute; top: 20px; right: 20px; width: 100px; height: 150px; object-fit: cover; border-radius: 10px; border: 2px solid var(--gold); z-index: 10; }
        .call-controls { position: absolute; bottom: 40px; left: 0; width: 100%; display: flex; justify-content: center; gap: 20px; z-index: 20; }
        .btn-end { background: #ff4757; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: none; cursor: pointer; }
        .btn-end svg { width: 30px; height: 30px; fill: white; transform: rotate(135deg); }

        .back-btn { display: none; background: transparent; border: none; color: white; }
        .back-btn svg { width: 24px; height: 24px; fill: white; }
        
        @media (max-width: 768px) {
            .sidebar { width: 100%; border-right: none; }
            .sidebar.hide { display: none; }
            .chat-area { width: 100%; display: none; }
            .chat-area.show { display: flex; }
            .back-btn { display: flex !important; }
        }
    </style>
</head>
<body>
    <!-- Sidebar Kontak -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">WhatsApp by Kyz</div>
        <div class="contact-list" id="contactList"></div>
    </div>

    <!-- Area Chat -->
    <div class="chat-area" id="chatArea">
        <div class="chat-header">
            <button class="back-btn" onclick="closeChatMobile()"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
            <div class="avatar-circle" id="chatHeaderAvatar"></div>
            <div style="flex:1;">
                <h3 id="chatHeaderName" style="font-size:16px;">Grup Kelas</h3>
                <p id="chatHeaderStatus" style="font-size:12px; opacity:0.8;">Online</p>
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages"></div>
        
        <!-- Kotak Reply -->
        <div class="reply-overlay" id="replyOverlay">
            <b id="replyName">Membalas...</b>
            <span id="replyText" style="color:#666; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></span>
            <button onclick="cancelReply()">×</button>
        </div>

        <div class="chat-input">
            <input type="file" id="mediaInput" accept="image/*,video/*" style="display:none" onchange="sendMedia(event)">
            <button class="btn-icon" onclick="document.getElementById('mediaInput').click()"><svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5a2.5 2.5 0 0 0 5 0V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg></button>
            <button class="btn-icon" id="micBtn" onclick="toggleRecording()"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
            <input type="text" id="msgInput" placeholder="Ketik pesan..." onkeypress="handleEnter(event)">
            <button class="btn-send" onclick="sendMessage()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
        </div>
    </div>

    <!-- Konteks Menu (Reply/Hapus) -->
    <div class="context-menu" id="contextMenu">
        <button onclick="replyToMessage()">Balas Pesan</button>
        <button class="del" id="deleteBtn" onclick="deleteMessage()">Hapus Pesan</button>
    </div>

    <!-- Video Call UI -->
    <div class="video-container" id="videoContainer">
        <video class="remote-video" id="remoteVideo" autoplay playsinline></video>
        <video class="local-video" id="localVideo" autoplay muted playsinline></video>
        <div class="call-controls">
            <button class="btn-end" onclick="endCall()"><svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.7l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28-.79-.73-1.68-1.36-2.66-1.85-.33-.16-.56-.51-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg></button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let currentUser = null; let activeChatId = 'group'; let activeChatName = 'Grup Kelas';
        let replyTarget = null; let selectedMessageId = null;
        const socket = io();
        let peer = null; let localStream = null; let currentCall = null;

        // Avatar Default
        function getAvatar(url) { return url ? `<img src="${url}">` : `<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`; }

        async function init() {
            try { const res = await fetch('/api/me'); if(!res.ok) throw new Error(); currentUser = await res.json(); } catch(e) { window.location.href = '/'; return; }
            
            // Sinyal Online
            socket.emit('user_online', currentUser.id);

            peer = new Peer(`class-xi5-user-${currentUser.id}`, { config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] } });
            peer.on('call', (call) => { 
                if(confirm('Panggilan masuk. Terima?')) {
                    navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                        localStream = stream; document.getElementById('localVideo').srcObject = stream; document.getElementById('videoContainer').classList.add('active');
                        call.answer(stream); currentCall = call;
                        call.on('stream', remote => { document.getElementById('remoteVideo').srcObject = remote; });
                    });
                } else call.close();
            });

            const usersRes = await fetch('/api/users'); const users = await usersRes.json();
            const contactList = document.getElementById('contactList');
            users.forEach(u => {
                const div = document.createElement('div'); div.className = 'contact';
                div.onclick = () => openChat(u.id, u.full_name, u.avatar_url);
                div.innerHTML = `<div class="avatar-circle">${getAvatar(u.avatar_url)}</div>
                                 <div><h4 style="font-size:15px; color:#333;">${u.full_name}</h4><p style="font-size:12px; color:#888;">Chat pribadi</p></div>`;
                contactList.appendChild(div);
            });

            socket.emit('join_chat', { room: 'group' }); socket.emit('join_chat', { room: 'dm', userId: currentUser.id });
            
            // Handler Pesan
            socket.on('receive_message', (msg) => {
                if (msg.sender_id == currentUser.id) {
                    const temp = document.getElementById(`temp-${msg.id}`);
                    if(temp) temp.remove(); 
                }
                
                // Cek apakah pesan ini untuk chat yang lagi kebuka
                let isCurrentChat = false;
                if (activeChatId === 'group' && msg.receiver_id === null) isCurrentChat = true;
                else if (activeChatId !== 'group' && (msg.sender_id == activeChatId || msg.receiver_id == activeChatId)) isCurrentChat = true;

                if (isCurrentChat) {
                    appendMessage(msg, msg.sender_id == currentUser.id);
                    // Kalau bukan dari kita, langsung kirim centang dibaca
                    if(msg.sender_id != currentUser.id) socket.emit('mark_as_read', { chat_id: activeChatId, current_user_id: currentUser.id });
                }
            });

            // Centang Biru
            socket.on('message_read_status', (data) => {
                const tick = document.getElementById(`tick-${data.message_id}`);
                if(tick) tick.classList.add('read');
            });

            // Hapus Pesan
            socket.on('message_deleted', (data) => {
                const el = document.getElementById(`msg-${data.message_id}`);
                if(el) el.remove();
            });

            // Status Online/Offline Teman
            socket.on('user_status_change', (data) => {
                if (activeChatId == data.userId) {
                    document.getElementById('chatHeaderStatus').innerText = data.status === 'online' ? 'Online' : 'Terakhir dilihat baru saja';
                    document.getElementById('chatHeaderStatus').style.color = data.status === 'online' ? '#25d366' : '#888';
                }
            });

            openChat('group', 'Grup Kelas', '');
            
            // Tutup menu klik kanan jika klik di luar
            document.addEventListener('click', () => { document.getElementById('contextMenu').style.display = 'none'; });
        }

        async function openChat(id, name, avatar) {
            activeChatId = id; 
            document.getElementById('chatHeaderName').innerText = name;
            document.getElementById('chatHeaderAvatar').innerHTML = getAvatar(avatar);
            document.getElementById('chatHeaderStatus').innerText = id === 'group' ? 'Semua anggota' : 'Online';
            document.getElementById('sidebar').classList.add('hide'); 
            document.getElementById('chatArea').classList.add('show');
            
            const res = await fetch(`/api/messages/${id}`); const messages = await res.json();
            const msgContainer = document.getElementById('chatMessages'); msgContainer.innerHTML = '';
            messages.forEach(m => appendMessage(m, m.sender_id == currentUser.id));
            
            // Tandai udah dibaca
            socket.emit('mark_as_read', { chat_id: activeChatId, current_user_id: currentUser.id });
            cancelReply();
        }

        function appendMessage(msg, isMine, tempId = null) {
            const div = document.createElement('div');
            div.className = `message ${isMine ? 'sent' : 'received'}`;
            div.id = tempId ? tempId : `msg-${msg.id}`;
            
            // Data buat Reply
            div.dataset.id = msg.id || tempId;
            div.dataset.text = msg.message || (msg.media_type ? `[${msg.media_type.toUpperCase()}]` : '');
            div.dataset.sender = isMine ? 'Anda' : (msg.full_name || 'Seseorang');
            
            // Fitur Long Press
            div.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                selectedMessageId = div.dataset.id;
                const menu = document.getElementById('contextMenu');
                document.getElementById('deleteBtn').style.display = isMine ? 'block' : 'none';
                menu.style.display = 'block';
                menu.style.left = Math.min(e.pageX, window.innerWidth - 150) + 'px';
                menu.style.top = Math.min(e.pageY, window.innerHeight - 100) + 'px';
            });

            let mediaHtml = '';
            if (msg.media) {
                if (msg.media_type === 'image') mediaHtml = `<img src="${msg.media}">`;
                else if (msg.media_type === 'video') mediaHtml = `<video src="${msg.media}" controls></video>`;
                else if (msg.media_type === 'audio') mediaHtml = `<audio src="${msg.media}" controls></audio>`;
            }

            let replyHtml = msg.reply_text ? `<div class="reply-box"><b>${msg.full_name || 'Seseorang'}</b>${msg.reply_text}</div>` : '';
            
            const timeStr = new Date(msg.created_at || new Date()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            let tickHtml = '';
            if (isMine) {
                tickHtml = `<svg id="tick-${msg.id}" class="tick ${msg.is_read ? 'read' : ''}" viewBox="0 0 16 15"><path d="M15.01 3.316l-.478-.372a.365.365 0 0 0-.51.063L8.666 9.879a.32.32 0 0 1-.484.033l-.358-.325a.319.319 0 0 0-.484.032l-.378.483a.418.418 0 0 0 .036.541l1.32 1.266c.143.14.361.125.484-.033l6.272-8.048a.366.366 0 0 0-.064-.512zm-4.1 0l-.478-.372a.365.365 0 0 0-.51.063L4.566 9.879a.32.32 0 0 1-.484.033L1.891 7.769a.366.366 0 0 0-.515.006l-.423.433a.364.364 0 0 0 .006.514l3.258 3.185c.143.14.361.125.484-.033l6.272-8.048a.365.365 0 0 0-.063-.51z"/></svg>`;
            }

            div.innerHTML = `${replyHtml}${mediaHtml}<p>${msg.message || ''}</p>
                             <span class="time">${timeStr} ${tickHtml}</span>`;
            
            const container = document.getElementById('chatMessages');
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // --- FITUR REPLY & HAPUS ---
        function replyToMessage() {
            replyTarget = selectedMessageId;
            document.getElementById('replyOverlay').style.display = 'block';
            document.getElementById('replyName').innerText = 'Membalas';
            document.getElementById('replyText').innerText = document.querySelector(`[data-id="${selectedMessageId}"]`).dataset.text;
            document.getElementById('msgInput').focus();
        }

        function cancelReply() {
            replyTarget = null;
            document.getElementById('replyOverlay').style.display = 'none';
        }

        function deleteMessage() {
            if(!confirm('Hapus pesan ini untuk semua orang?')) return;
            socket.emit('delete_message', { message_id: selectedMessageId, chat_id: activeChatId });
        }

        // --- KIRIM PESAN ---
        function sendMessage() {
            const input = document.getElementById('msgInput'); const text = input.value.trim();
            if (!text) return;
            const tempId = `temp-${Date.now()}`;
            
            appendMessage({ message: text, sender_id: currentUser.id, reply_text: replyTarget ? document.querySelector(`[data-id="${replyTarget}"]`).dataset.text : null }, true, tempId);
            input.value = '';
            
            socket.emit('send_message', { sender_id: currentUser.id, sender_name: currentUser.name, receiver_id: activeChatId, message: text, media: null, media_type: null, reply_to_id: replyTarget });
            cancelReply();
        }

        function sendMedia(event) {
